services:
  database:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: accounting_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accounting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting_password}
      POSTGRES_DB: ${POSTGRES_DB:-accounting_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: accounting_embedding
    command: ["--model-id", "nlpai-lab/KURE-v1"]
    ports:
      - "8080:80"
    volumes:
      - tei_cache:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-accounting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting_password}
      POSTGRES_DB: ${POSTGRES_DB:-accounting_db}
      EMBEDDING_SERVER_URL: http://embedding:80
      FRONTEND_DIST_DIR: /app/frontend/dist
      # 리랭커(bge-reranker-v2-m3, ~2.2GB)가 HF 허브에서 받는 모델을 이 경로에 캐시한다.
      # 아래 hf_cache 볼륨과 짝을 이뤄 컨테이너 재생성마다 2.2GB를 다시 받지 않게 한다.
      HF_HOME: /app/hf_cache
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - hf_cache:/app/hf_cache   # 리랭커 모델 재생성 시 재다운로드 방지
    depends_on:
      database:
        condition: service_healthy
      embedding:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  tei_cache:
  hf_cache:
